name: security

# Release gate de seguridad en CI. Detecta automáticamente el stack del proyecto
# y ejecuta los scanners correspondientes:
# - Python: bandit (SAST) + pip-audit (dependencias) + detect-secrets.
# - JS/TS: npm audit.
# Complementa a /8-auditar que se ejecuta manualmente durante el desarrollo.
# Si alguno falla, el PR se bloquea hasta resolver o documentar la excepción
# en docs/security/.

on:
  pull_request:
    branches: [main, master, Liebana]
  push:
    branches: [main, master, Liebana]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detectar stack
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.check.outputs.python }}
      node: ${{ steps.check.outputs.node }}
    steps:
      - uses: actions/checkout@v4

      - name: Detectar pyproject.toml / requirements.txt / package.json
        id: check
        shell: bash
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f Pipfile ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

  python-sast:
    name: Python SAST (bandit)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Run bandit
        # -ll = medium+ severity; -i = include confidence filter.
        # Falla el CI si hay findings medium+ no suprimidos en pyproject.toml.
        run: bandit -r src/ -ll -i -f txt

  python-deps:
    name: Python dependency scan (pip-audit)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Export locked dependencies
        # Audita el set fijado en uv.lock (runtime + dev), no el tooling del
        # runner: pip install -e . && pip-audit auditaba tambien el setuptools
        # del propio runner (CVEs ajenos al proyecto) y rompia el gate.
        run: uv export --no-hashes --no-emit-project -o requirements.ci.txt

      - name: Run pip-audit
        # Cualquier CVE en dependencias lockeadas bloquea el PR.
        run: uvx pip-audit -r requirements.ci.txt --strict --desc

  python-secrets:
    name: Secret scanning (detect-secrets)
    needs: detect
    if: needs.detect.outputs.python == 'true' || needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install detect-secrets
        # Version pinned so the scan matches the committed baseline.
        run: pip install detect-secrets==1.5.0
      - name: Scan for secrets
        # SEC-901: `detect-secrets scan` solo genera un baseline y sale con 0,
        # asi que el job nunca podia bloquear un secreto. Ahora se escanea
        # fresco con los mismos argumentos con los que se genero
        # .secrets.baseline y se falla si aparece un hallazgo que no este ahi.
        # Los paths se normalizan porque el baseline se genera en Windows.
        run: |
          detect-secrets scan --exclude-files '\.claude' > fresh.baseline
          python - <<'PY'
          import json, sys

          base = json.load(open(".secrets.baseline", encoding="utf-8-sig"))["results"]
          fresh = json.load(open("fresh.baseline", encoding="utf-8-sig"))["results"]


          def flatten(results):
              return {
                  (item["filename"].replace("\\", "/"), item["hashed_secret"])
                  for items in results.values()
                  for item in items
              }


          known, found = flatten(base), flatten(fresh)
          new = found - known
          for file, _ in sorted(new):
              print(f"::error file={file}::new secret detected by detect-secrets (not in .secrets.baseline)")
          print(f"known={len(known)} found={len(found)} new={len(new)}")
          sys.exit(1 if new else 0)
          PY

  node-deps:
    name: Node dependency scan (npm audit)
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: Run npm audit
        # Falla el CI si hay vulnerabilidades de nivel high+.
        run: npm audit --audit-level=high
