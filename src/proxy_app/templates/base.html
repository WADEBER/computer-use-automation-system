<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}MemberServ Console{% endblock %}</title>
  <style>
    body { font-family: Verdana, Arial, sans-serif; font-size: 13px; margin: 0; background: #e9e9e9; color: #111; }
    #banner { background: #1f3864; color: #fff; padding: 8px 16px; }
    #banner b { color: #ffd966; }
    #content { max-width: 860px; margin: 16px auto; background: #fff; border: 1px solid #999; padding: 16px; }
    table { border-collapse: collapse; width: 100%; margin: 8px 0; }
    th, td { border: 1px solid #808080; padding: 4px 8px; text-align: left; }
    th { background: #d9d9d9; }
    .btn { background: #1f3864; color: #fff; border: 1px solid #000; padding: 4px 14px; cursor: pointer; font-size: 13px; }
    .errorlist { color: #a40000; background: #fff2f2; border: 1px solid #a40000; padding: 6px 10px; margin: 8px 0; }
    .notfound { color: #7f6000; background: #fff2cc; border: 1px solid #bf9000; padding: 6px 10px; }
    .overlay { border: 2px solid #1f3864; background: #f7f7f7; padding: 14px; margin: 12px 0; }
    .muted { color: #555; }
    a { color: #0645ad; }
  </style>
</head>
<body>
  <div id="banner"><b>MemberServ</b> Console v4.2 &mdash; Legacy Banking Back Office</div>
  <div id="content">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
