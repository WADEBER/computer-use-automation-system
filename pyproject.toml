[project]
name = "computer-use-automation-system"
version = "0.1.0"
description = "Goal-driven computer-use automation: LLM workflow discovery, deterministic replay, safety guardrails, and human-in-the-loop escalation for legacy banking UIs."
readme = "README.md"
authors = [
    { name = "Diego Liébana", email = "dliebana.dl@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "selenium>=4.49.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-requests>=2.33.0.20260906",
]

[project.scripts]
computer-use-automation-system = "computer_use_automation_system:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-requests>=2.33.0.20260906",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
